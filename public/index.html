function tGenBoard(o,r){const n=Math.min(8,1+Math.ceil(r*.55)),L=Math.min(7,1+Math.floor(r/2)),od=TFT_ODDS[L],pick=()=>{let x=Math.random()*100,t=0;for(;t<3;t++){x-=od[t];if(x<=0)break}let pool=TFT_T[t].length?TFT_T[t]:TFT_POOL;const fav=pool.filter(k=>tTraits(k).includes(o.fav));if(fav.length&&Math.random()<.55)pool=fav;return pool[Math.floor(Math.random()*pool.length)]};
 const p2=Math.min(.7,Math.max(0,(r-2)*.08*o.skill)),p3=r>=10?Math.min(.25,(r-9)*.05*o.skill):0,us=[];for(let i=0;i<n;i++){const z=Math.random();us.push({id:pick(),st:z<p3?3:z<p3+p2?2:1})}
