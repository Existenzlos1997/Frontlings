<!doctype html><html><body style="margin:0;background:#0000">
<script type="importmap">{"imports":{"three":"/three.js/build/three.module.js","three/addons/":"/three.js/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
// Rendert ein animiertes GLB als Seitenansicht-Spritesheet (Frames je Clip)
window.renderSheet=async(url,clips,frames,size)=>{const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(size,size);r.setClearColor(0,0);r.outputColorSpace=THREE.SRGBColorSpace;
 const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xfff4e0,0x5a3a90,2.2));const d=new THREE.DirectionalLight(0xffffff,2.4);d.position.set(3,5,4);sc.add(d);const rim=new THREE.DirectionalLight(0xb8a0ff,1.6);rim.position.set(-4,2,-3);sc.add(rim);
 const g=await new GLTFLoader().loadAsync(url),m=g.scene;sc.add(m);const box=new THREE.Box3().setFromObject(m),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());
 const h=Math.max(s.y,s.x*0.9)*1.15,cam=new THREE.OrthographicCamera(-h/2,h/2,h/2,-h/2,0.01,100);cam.position.set(c.x+10*Math.sin(Math.PI/2*0.8),box.min.y+h*0.48+h*0.08,c.z+10*Math.cos(Math.PI/2*0.8));cam.lookAt(c.x,box.min.y+h*0.48-h*0.02,c.z);
 const mix=new THREE.AnimationMixer(m),out=document.createElement('canvas');out.width=size*frames;out.height=size*clips.length;const o=out.getContext('2d'),names=g.animations.map(a=>a.name);
 for(let ci=0;ci<clips.length;ci++){const clip=g.animations.find(a=>a.name===clips[ci])||g.animations[0];mix.stopAllAction();const a=mix.clipAction(clip);a.reset().play();
  for(let f=0;f<frames;f++){mix.setTime(clip.duration*f/frames);r.render(sc,cam);o.drawImage(r.domElement,f*size,ci*size)}}
 return {png:out.toDataURL('image/png'),names}};
</script></body></html>
